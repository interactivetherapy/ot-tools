<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Occupational Therapy (OT) Evaluation · Interactive Therapy Solutions</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#A5047E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OT Tools">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="../shell.css">
</head>
<body data-tab="form">
<header class="top no-print">
  <div class="top-a">
    <div class="brand"><img class="logo" src="icons/logo-badge.png" alt="Practice logo"><div class="bt"><div class="prac" id="practice"></div><div class="title" id="apptitle"></div></div></div>
    <div class="tools"><button type="button" class="btn sm" data-act="print">Print / PDF</button><button type="button" class="btn sm ghost" data-act="sigmanage" title="Clinician signatures (this device)" aria-label="Clinician signatures">⚙ Signatures</button><button type="button" class="btn sm ghost" data-act="export">Export</button><button type="button" class="btn sm ghost" data-act="import">Import</button><button type="button" class="btn sm ghost" data-act="new">New</button></div>
  </div>
  <div class="top-b">
    <nav class="tabs"><button type="button" data-act="tab" data-v="form">Evaluation</button><button type="button" data-act="tab" data-v="scores">Scores</button><button type="button" data-act="tab" data-v="report">Report</button><button type="button" data-act="tab" data-v="parent">Parent Summary</button><button type="button" data-act="tab" data-v="goals">Goal Areas</button><button type="button" data-act="tab" data-v="guide">Intervention Guide</button></nav>
    <div id="childbar" class="childbar"></div>
    <div id="nav" class="secnav"></div>
  </div>
</header>
<main>
  <div id="form" class="view"></div>
  <div id="scores" class="view"></div>
  <div id="report" class="view"></div>
  <div id="parent" class="view"></div>
  <div id="goals" class="view"></div>
  <div id="guide" class="view"></div>
</main>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="prefillFile" accept="application/json,.json" hidden>
<script src="../shell.js" data-tool="eval"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
